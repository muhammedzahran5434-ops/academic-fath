<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FATH MATES — Darul Hasanath Islamic College</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ═══════════ Tokens ═══════════ */
:root{
  --bg:#f6f5fb; --card:#ffffff; --card2:#faf9fe; --text:#17131f; --muted:#6f6a7d;
  --border:#e7e4f2; --primary:#7c3aed; --primary-soft:#f1ebfd; --primary-2:#a855f7;
  --grad:linear-gradient(135deg,#7c3aed,#db2777); --grad2:linear-gradient(135deg,#7c3aed,#a855f7);
  --red:#e11d48; --red-soft:#fde8ee; --green:#059669; --green-soft:#e7f6f0;
  --amber:#d97706; --amber-soft:#fdf3e3; --sky:#0284c7; --sky-soft:#e6f4fb;
  --shadow:0 1px 2px rgba(23,19,31,.05),0 8px 28px -12px rgba(124,58,237,.16);
  --shadow-lg:0 24px 60px -20px rgba(23,19,31,.28);
  --r:16px; --r-sm:12px;
}
.dark{
  --bg:#0f0b1a; --card:#171226; --card2:#1d1730; --text:#f3f0fa; --muted:#a79fbf;
  --border:#2a2242; --primary:#a78bfa; --primary-soft:#251d40; --primary-2:#c084fc;
  --red:#fb7185; --red-soft:#3b1a26; --green:#34d399; --green-soft:#12301f;
  --amber:#fbbf24; --amber-soft:#33260f; --sky:#38bdf8; --sky-soft:#0c2735;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.55);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(700px 380px at 85% -10%,rgba(124,58,237,.10),transparent 60%),
             radial-gradient(600px 340px at -10% 30%,rgba(219,39,119,.07),transparent 60%)}
.dark body::before{background:radial-gradient(700px 380px at 85% -10%,rgba(124,58,237,.16),transparent 60%),
  radial-gradient(600px 340px at -10% 30%,rgba(219,39,119,.10),transparent 60%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,video{max-width:100%;display:block}
.ic{flex:none;vertical-align:-2px}
::selection{background:rgba(124,58,237,.25)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(124,58,237,.28);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;line-height:1.15}

/* ═══════════ Layout ═══════════ */
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.main{padding:24px 0 96px}
@media(min-width:900px){.main{padding:28px 0 60px}}

/* ═══════════ Buttons / inputs / cards ═══════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;
  padding:10px 16px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--card);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,background .18s,opacity .18s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad2);border:0;color:#fff;box-shadow:0 10px 22px -10px rgba(124,58,237,.55)}
.btn-danger{background:var(--red-soft);border-color:transparent;color:var(--red)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--card);color:var(--text)}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-icon{padding:9px;border-radius:12px}
.input,select.input,textarea.input{width:100%;background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px;outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,.13)}
textarea.input{resize:vertical;min-height:80px}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;margin:0 0 6px 2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12px;
  font-weight:700;border:1px solid var(--border);background:var(--card2)}
.chip.on{background:var(--primary-soft);border-color:transparent;color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.02em}
.b-vip{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
.b-admin{background:var(--grad2);color:#fff}
.b-pending{background:var(--amber-soft);color:var(--amber)}
.b-approved{background:var(--green-soft);color:var(--green)}
.b-rejected{background:var(--red-soft);color:var(--red)}
.b-off{background:var(--red-soft);color:var(--red)}
.b-muted{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* ═══════════ Avatar ═══════════ */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;
  color:#fff;font-weight:800;overflow:hidden;flex:none;user-select:none}
.av img{width:100%;height:100%;object-fit:cover}
.av .dot{position:absolute;right:0;bottom:0;width:26%;height:26%;min-width:9px;min-height:9px;
  background:#10b981;border:2px solid var(--card);border-radius:50%}

/* ═══════════ Top navbar ═══════════ */
.top{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;cursor:pointer}
.brand .fm{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 8px 18px -8px rgba(124,58,237,.7)}
.brand .t1{font-size:15px;line-height:1.05}
.brand .t2{font-size:9.5px;letter-spacing:.18em;color:var(--muted);font-weight:700;text-transform:uppercase}
.nav-links{display:none;gap:2px;margin-left:8px}
@media(min-width:900px){.nav-links{display:flex}}
.nav-links button{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:11px;font-weight:600;
  font-size:13.5px;color:var(--muted);transition:background .15s,color .15s}
.nav-links button:hover{background:var(--card);color:var(--text)}
.nav-links button.on{background:var(--primary-soft);color:var(--primary)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.searchbox{position:relative;display:none}
@media(min-width:720px){.searchbox{display:block}}
.searchbox input{width:220px;padding:9px 12px 9px 36px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--card);font-size:13.5px;outline:none}
.searchbox .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-pop{position:absolute;top:46px;right:0;width:290px;max-height:340px;overflow:auto;z-index:80;
  background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:6px}
.search-pop button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:10px;text-align:left;font-weight:600;font-size:13.5px}
.search-pop button:hover{background:var(--card2)}
.bell-wrap,.theme-wrap{position:relative}
.icon-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);transition:all .18s}
.icon-btn:hover{color:var(--text);transform:translateY(-1px);box-shadow:var(--shadow)}
.bell-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
  animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.me-chip{display:flex;align-items:center;gap:9px;padding:5px 12px 5px 6px;border-radius:99px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;transition:box-shadow .18s,transform .18s}
.me-chip:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.me-chip .n{font-weight:800;font-size:13px;line-height:1.1;text-align:left}
.me-chip .r{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.pop{position:absolute;right:0;top:48px;width:270px;z-index:90;background:var(--card);border:1px solid var(--border);
  border-radius:14px;box-shadow:var(--shadow-lg);padding:6px;animation:pop .22s cubic-bezier(.34,1.56,.64,1)}
.pop .ph{padding:9px 11px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.pop button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 11px;border-radius:10px;font-weight:600;font-size:13.5px;text-align:left}
.pop button:hover{background:var(--card2)}
.pop button.danger{color:var(--red)}

/* ═══════════ Bottom nav (mobile) ═══════════ */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
@media(min-width:900px){.bottom-nav{display:none}}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;
  color:var(--muted);padding:4px 10px;border-radius:12px;transition:color .15s,transform .15s}
.bottom-nav button:active{transform:scale(.92)}
.bottom-nav button.on{color:var(--primary)}
.bottom-nav button.on .ic{animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
</style>
<style>
/* ═══════════ Landing ═══════════ */
.hero{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;animation:float 9s ease-in-out infinite}
.blob.b1{width:420px;height:420px;background:rgba(124,58,237,.20);top:-120px;right:-100px}
.blob.b2{width:380px;height:380px;background:rgba(219,39,119,.14);bottom:-120px;left:-120px;animation-delay:-3s}
.hero-top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.hero-mid{flex:1;display:flex;align-items:center;padding:30px 0}
.hero-grid{display:grid;gap:44px;align-items:center;width:100%}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr}}
.hero h1{font-size:clamp(34px,6vw,58px);line-height:1.04}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{margin-top:18px;font-size:16.5px;color:var(--muted);max-width:520px}
.hero-cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.hero-cta .btn{padding:13px 24px;font-size:15px;border-radius:14px}
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:54px}
.feat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;
  box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}
.feat:hover{transform:translateY(-5px) rotate(-.4deg);box-shadow:var(--shadow-lg)}
.feat .fi{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.feat h3{font-size:15.5px}
.feat p{font-size:13px;color:var(--muted);margin-top:4px}
.phone-mock{position:relative;display:none}
@media(min-width:900px){.phone-mock{display:block}}
.phone{width:300px;margin:0 auto;border-radius:34px;border:1px solid var(--border);background:var(--card);
  box-shadow:var(--shadow-lg);padding:16px;animation:float 7s ease-in-out infinite}
.phone .pr{border-radius:22px;background:var(--card2);border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:430px}
.mock-row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border);border-radius:13px;padding:10px}
.mock-row .sk{height:8px;border-radius:99px;background:var(--border)}
.hero-foot{padding:22px 0;text-align:center;color:var(--muted);font-size:12.5px}

/* ═══════════ Auth ═══════════ */
.auth{display:grid;min-height:100vh}
@media(min-width:900px){.auth{grid-template-columns:1fr 1fr}}
.auth-side{position:relative;display:none;flex-direction:column;justify-content:space-between;overflow:hidden;
  background:linear-gradient(140deg,#6d28d9,#7c3aed 45%,#db2777);color:#fff;padding:44px}
@media(min-width:900px){.auth-side{display:flex}}
.auth-side .glow{position:absolute;border-radius:50%;filter:blur(60px)}
.auth-side h2{font-size:clamp(30px,3.4vw,46px);line-height:1.08}
.auth-side .stat-row{display:flex;gap:26px;flex-wrap:wrap}
.auth-side .stat-row b{font-size:26px;display:block}
.auth-side .stat-row span{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding:26px;position:relative}
.auth-card{width:100%;max-width:420px;margin:0 auto;animation:fadeUp .5s cubic-bezier(.22,1,.36,1)}
.auth-tabs{display:flex;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:4px;margin:18px 0}
.auth-tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted);transition:all .2s}
.auth-tabs button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.err{display:flex;gap:9px;align-items:flex-start;background:var(--red-soft);color:var(--red);
  border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;margin-bottom:14px;animation:shake .4s}
.hint{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted);background:var(--card2);
  border:1px dashed var(--border);border-radius:11px;padding:9px 12px;margin-top:14px}
.pass-wrap{position:relative}
.pass-wrap .pe{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:7px;color:var(--muted);border-radius:9px}
.pass-wrap .pe:hover{color:var(--text)}

/* ═══════════ Page head + sections ═══════════ */
.phead{margin-bottom:20px;animation:fadeUp .45s cubic-bezier(.22,1,.36,1)}
.phead .kick{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--primary);display:flex;align-items:center;gap:8px}
.phead .kick::before{content:"";width:22px;height:2.5px;border-radius:99px;background:var(--grad)}
.phead h1{font-size:clamp(26px,4vw,36px);margin-top:6px}
.phead p{color:var(--muted);margin-top:4px;font-size:14px}
.phead .row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.grid2{display:grid;gap:16px}
@media(min-width:960px){.grid2{grid-template-columns:1.6fr 1fr}}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.tile:hover{transform:translateY(-3px)}
.tile .ic-bg{position:absolute;right:-14px;bottom:-16px;opacity:.10;transform:rotate(-12deg)}
.tile .tv{font-size:11px;font-weight:800;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
.tile .tn{font-size:27px;font-weight:800;margin-top:5px;line-height:1}
.tile .ts{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.qgrid{grid-template-columns:repeat(3,1fr)}}
.qa{display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1),box-shadow .22s,border-color .22s}
.qa:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:rgba(124,58,237,.4)}
.qa .qi{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff}
.qa b{font-size:14.5px}
.qa span{font-size:12px;color:var(--muted);font-weight:600}
.sect-h{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sect-h h3{font-size:16px}
.sect-h .card-tag{font-size:12px;color:var(--muted);font-weight:700}
.link-btn{color:var(--primary);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
.link-btn:hover{text-decoration:underline}
.rowline{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--border)}
.rowline:last-child{border-bottom:0}
.rowline .n{font-weight:700;font-size:13.5px;line-height:1.2}
.rowline .s{font-size:12px;color:var(--muted)}

/* ═══════════ Feed ═══════════ */
.composer .top-row{display:flex;gap:11px}
.composer textarea{border:0;background:transparent;outline:none;width:100%;font-size:14.5px;min-height:64px;resize:vertical}
.composer .foot{display:flex;align-items:center;gap:6px;border-top:1px solid var(--border);padding-top:11px;margin-top:10px}
.post{animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
.post .head{display:flex;align-items:center;gap:11px}
.post .body{padding:2px 0 8px;white-space:pre-wrap;word-break:break-word}
.post .media{border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-bottom:10px;position:relative;background:#000}
.post .media img{width:100%;max-height:480px;object-fit:cover}
.post .media video{width:100%;max-height:480px}
.post .acts{display:flex;gap:4px;border-top:1px solid var(--border);padding-top:8px}
.pact{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:11px;font-weight:700;font-size:13px;color:var(--muted);transition:all .18s}
.pact:hover{background:var(--card2);color:var(--text)}
.pact.on{color:var(--red)}
.pact.on .ic{fill:currentColor;animation:heartbeat .45s}
.pact.onl{color:var(--sky)}
.comments{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:9px}
.crow{display:flex;gap:9px;align-items:flex-start}
.crow .bub{background:var(--card2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:8px 12px;font-size:13.5px;max-width:85%}
.crow .bub b{font-size:12.5px}
.cform{display:flex;gap:8px;margin-top:4px}
.cform input{flex:1}

/* ═══════════ Stories ═══════════ */
.stories{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.stcard{flex:none;width:120px;height:190px;border-radius:18px;overflow:hidden;position:relative;cursor:pointer;
  border:1px solid var(--border);transition:transform .22s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow)}
.stcard:hover{transform:translateY(-5px) scale(1.02)}
.stcard .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;color:#fff;
  font-weight:700;font-size:13px;text-align:center;line-height:1.35}
.stcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stcard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stcard .who{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 10px;color:#fff;font-size:11.5px;font-weight:800;
  background:linear-gradient(transparent,rgba(0,0,0,.72));display:flex;align-items:center;gap:6px}
.stcard.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:var(--card);color:var(--muted);font-weight:700;font-size:12.5px}

/* ─────────── password hash ─────────── */
async function sha256(str){
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
    return[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ // deterministic fallback if subtle unavailable (old file:// contexts)
    let h1=0x811c9dc5,h2=0x1000193;
    for(let i=0;i<str.length;i++){h1=(h1^str.charCodeAt(i))*16777619>>>0;h2=(h2+str.charCodeAt(i)*31)>>>0}
    return'fnv'+h1.toString(16)+h2.toString(16);
  }
}
async function hashPassword(pw){const salt=Math.random().toString(36).slice(2,12);return salt+':'+await sha256(salt+pw)}
async function verifyPassword(pw,stored){const[salt,hash]=String(stored).split(':');return hash===await sha256(salt+pw)}

/* ─────────── media store (IndexedDB, localStorage fallback) ─────────── */
const Media=(()=>{
  let idb=null,fb=false;const urls={};
  async function init(){
    try{
      idb=await new Promise((res,rej)=>{const r=indexedDB.open('fm_media',1);
        r.onupgradeneeded=()=>{try{r.result.createObjectStore('m')}catch(e){}};
        r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
    }catch(e){idb=null;fb=true}
  }
  function idbTx(mode){return idb.transaction('m',mode).objectStore('m')}
  function put(id,data){
    if(idb){try{idbTx('readwrite').put(data,id)}catch(e){fbPut(id,data)}}
    else fbPut(id,data);
  }
  function fbPut(id,data){
    const f=DB.files.find(f=>f.id===id);
    if(f&&typeof data==='string'&&data.length<1500000){f.data=data;saveDB()}
  }
  function get(id){
    return new Promise(res=>{
      if(!id)return res(null);
      if(urls[id])return res(urls[id]);
      const reg=DB.files.find(f=>f.id===id);
      if(!reg)return res(null);
      if(idb){
        try{const rq=idbTx('readonly').get(id);
          rq.onsuccess=()=>{const v=rq.result;
            if(v){urls[id]=v instanceof Blob?URL.createObjectURL(v):v;res(urls[id])}
            else if(reg.data){urls[id]=reg.data;res(reg.data)}else res(null)};
          rq.onerror=()=>res(reg.data||null);
        }catch(e){res(reg.data||null)}
      }else res(reg.data||null);
    });
  }
  function del(id){
    if(idb){try{idbTx('readwrite').delete(id)}catch(e){}}
    if(urls[id]){try{URL.revokeObjectURL(urls[id])}catch(e){}delete urls[id]}
  }
  return{init,get,put,del};
})();
async function imgDataURL(file,max=1000,q=.82){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return cv.toDataURL('image/jpeg',q);
  }finally{URL.revokeObjectURL(url)}
}
/* returns registry entry {id,name,mime,kind,size} */
async function storeMedia(file){
  const isImg=file.type.startsWith('image/'),isVid=file.type.startsWith('video/');
  const cap=isImg?8e6:isVid?6e7:3e7;
  if(file.size>cap)throw new Error(`${isVid?'Video':isImg?'Image':'File'} too large — max ${fmtSize(cap)}`);
  const id=uid();
  const entry={id,name:file.name||('media-'+id),mime:file.type||'application/octet-stream',kind:isImg?'image':isVid?'video':'file',size:file.size,uploader:me().id,at:nowISO(),data:''};
  if(isImg){
    const du=await imgDataURL(file);
    entry.size=Math.round(du.length*.75);entry.mime='image/jpeg';entry.data=du;
    Media.put(id,du);
  }else{
    Media.put(id,file);
  }
  DB.files.unshift(entry);
  saveDB();
  return entry;
}
async function delMedia(id){if(!id)return;Media.del(id);DB.files=DB.files.filter(f=>f.id!==id)}

/* ─────────── toast + modal ─────────── */
function toast(msg,type='info'){
  const t=document.createElement('div');t.className='toast '+type;
  const ic=type==='success'?'check':type==='error'?'x':type==='warning'?'warn':'info';
  t.innerHTML=`<span class="ti">${icon(ic,15)}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateX(30px)';setTimeout(()=>t.remove(),320)},3400);
}
function openModal(html){
  const r=$('#modal-root');
  r.innerHTML=`<div class="overlay" data-overlay><div class="sheet">${html}</div></div>`;
  r.querySelector('[data-overlay]').addEventListener('mousedown',e=>{if(e.target===e.currentTarget)closeModal()});
}
function closeModal(){$('#modal-root').innerHTML=''}
function confirmBox(msg,okLabel='Delete'){
  return new Promise(res=>{
    openModal(`<div class="sh"><h3>Are you sure?</h3><button class="btn-ghost btn-icon" data-x>${icon('x')}</button></div>
      <p style="margin-bottom:18px;font-size:14px">${esc(msg)}</p>
      <div style="display:flex;gap:9px;justify-content:flex-end">
        <button class="btn" data-no>Cancel</button><button class="btn btn-danger" data-yes>${esc(okLabel)}</button></div>`);
    $('#modal-root [data-x]').onclick=$('#modal-root [data-no]').onclick=()=>{closeModal();res(false)};
    $('#modal-root [data-yes]').onclick=()=>{closeModal();res(true)};
  });
}
function promptText(title,def='',placeholder=''){
  return new Promise(res=>{
    openModal(`<div class="sh"><h3>${esc(title)}</h3></div>
      <input class="input" id="pm-in" value="${esc(def)}" placeholder="${esc(placeholder)}">
      <div style="display:flex;gap:9px;justify-content:flex-end;margin-top:16px">
        <button class="btn" data-no>Cancel</button><button class="btn btn-primary" data-yes>Save</button></div>`);
    const inp=$('#pm-in');inp.focus();inp.select();
    const done=v=>{closeModal();res(v)};
    $('#modal-root [data-no]').onclick=()=>done(null);
    $('#modal-root [data-yes]').onclick=()=>done(inp.value.trim());
    inp.onkeydown=e=>{if(e.key==='Enter')done(inp.value.trim());if(e.key==='Escape')done(null)};
  });
}

async function doLogin(){
  const un=$('#lg-user').value.trim(),pw=$('#lg-pass').value;
  const errBox=$('#auth-err');
  const fail=m=>{errBox.innerHTML=`<div class="err">${icon('warn',16)}<span>${esc(m)}</span></div>`};
  errBox.innerHTML='';
  if(!un)return fail('Enter your '+(authTab==='staff'?'username':'admission number'));
  if(!pw)return fail('Enter your password');
  const u=userByUn(un);
  if(!u)return fail('No account found with that '+(authTab==='staff'?'username':'admission number')+'. Ask the office.');
  if(authTab==='staff'&&u.role==='member')return fail('This is a member account — use the Member tab.');
  if(authTab==='member'&&u.role==='admin')return fail('Staff accounts must sign in from the Staff tab.');
  if(!(await verifyPassword(pw,u.password)))return fail('Incorrect password. Try again.');
  if(u.disabled)return fail('Your account has been disabled by the administrator.');
  const token=uid();DB.sessions[token]=u.id;u.onlineAt=nowISO();saveDB();setToken(token);
  notify(u.id,'Welcome back! You signed in successfully.','success');
  state.view='dashboard';renderApp();
  toast('Welcome back, '+(displayName(u)||u.username)+'!','success');
}

function chatUnread(){const m=me();const c={};for(const msg of DB.messages){if(msg.to===m.id&&!msg.deleted){const n=(c[msg.from]||0)+1;c[msg.from]=n}}return c}

function renderMediaPreview(md){

  return `<span class="chip" style="margin-top:10px">${icon('file',14)} ${esc(md.name)}</span>`;
}

    <p class="small muted" style="margin-top:10px">Marks are entered by moderators and approved by the office.</p>`;
  }
  const s=DB.subjects.find(x=>x.id===state.acSubject)||DB.subjects[0];
  const members=DB.users.filter(u=>u.role!=='admin').sort((a,b)=>a.username.localeCompare(b.username,undefined,{numeric:true}));
  return `<div class="phead"><div class="kick">CCE marks</div><h1>Academic</h1><p>Enter continuous evaluation marks per subject.</p></div>

      const pending=mk&&mk.pending!=null?mk.pending:null;const val=mk&&mk.marks!=null?mk.marks:null;
      const shown=val!=null?val:pending;const pct=shown!=null?Math.round(shown/s.max*100):null;const g=pct!=null?gradeOf(pct):null;

function saveMarks(){
  const inputs=$$('[data-mark]');
  for(const inp of inputs){
    const uidn=inp.dataset.mark,sid=inp.dataset.sub,v=inp.value.trim();

    let mkObj=mk;
    if(!mk){mkObj={id:uid(),userId:uidn,subjectId:sid,marks:null,pending:null};DB.marks.push(mkObj)}
    mkObj.pending=Number(v);
    notify(uidn,'Your CCE marks were updated','info');

}

<script>
/* ═══════════ router + boot ═══════════ */
function renderApp(){
  const m=me();
  if(!m){$('#app').innerHTML=state.screen==='auth'?renderAuth():renderLanding();state.screen=state.screen==='auth'?'auth':'landing'}
  else{
    state.screen='app';
    const views={dashboard:renderDashboard,feed:renderFeed,status:renderStatus,chat:renderChat,awards:renderAwards,board:renderBoard,notices:renderNotices,members:renderMembers,media:renderMedia,academic:renderAcademic,profile:renderProfile,settings:renderSettings};
    const fn=views[state.view]||renderDashboard;
    if(state.view==='members'&&!canMod(m))state.view='dashboard';
    if(state.view==='media'&&!canMod(m))state.view='dashboard';
    $('#app').innerHTML=renderShell(fn());
  }
  hydrateMedia();
  window.scrollTo({top:0});
  if(state.view==='chat'){const el=$('#msgs');if(el)el.scrollTop=el.scrollHeight}
}
async function hydrateMedia(){
  for(const el of $$('[data-media]')){
    const id=el.dataset.media;if(!id)continue;
    const url=await Media.get(id);
    if(url){if(el.tagName==='IMG')el.src=url;else if(el.tagName==='VIDEO'){el.src=url;if(el.hasAttribute('muted'))el.play().catch(()=>{})}}
  }
  for(const el of $$('[data-dl]')){
    el.onclick=async e=>{e.preventDefault();e.stopPropagation();
      const url=await Media.get(el.dataset.dl);
      if(!url)return toast('Media not found','error');
      const f=DB.files.find(x=>x.id===el.dataset.dl);
      const a=document.createElement('a');a.href=url;a.download=(f&&f.name)||'fath-mates-media';a.click();
    };
  }
}
function go(v){state.view=v;state.profileOf='';state.editMode=false;state.menuOpen=false;state.bellOpen=false;state.searchOpen=false;renderApp()}

/* ═══════════ event delegation ═══════════ */
const ACTIONS={
  'theme':()=>{const d=document.documentElement.classList.toggle('dark');LS.set('fm_theme',d?'dark':'light');renderApp()},
  'go-auth':()=>{state.screen='auth';renderApp()},
  'go-landing':()=>{state.screen='landing';renderApp()},
  'scroll-feats':()=>$('#feats').scrollIntoView({behavior:'smooth'}),
  'auth-tab':d=>{authTab=d.tab;renderApp()},
  'toggle-pass':()=>{authShow=!authShow;renderApp();const p=$('#lg-pass');if(p){p.focus();p.setSelectionRange(p.value.length,p.value.length)}},
  'toggle-cp':d=>{if(d.t==='1')setN1=!setN1;else setN2=!setN2;renderApp()},
  'nav':d=>{go(d.view)},
  'open-profile':d=>{state.view='profile';state.profileOf=d.user;state.editMode=false;state.menuOpen=false;renderApp()},
  'open-profile-id':d=>{const u=userById(d.id);if(u){state.view='profile';state.profileOf=u.username;state.editMode=false;renderApp()}},
  'edit-own':()=>{state.editMode=!state.editMode;renderApp()},
  'menu':()=>{state.menuOpen=!state.menuOpen;state.bellOpen=false;renderApp()},
  'bell':()=>{state.bellOpen=!state.bellOpen;state.menuOpen=false;renderApp()},
  'read-all':()=>{const m=me();for(const n of DB.notifications)if(n.userId===m.id)n.read=true;saveDB();renderApp()},
  'notif':()=>{state.bellOpen=false;go('dashboard')},
  'signout':async()=>{const m=me();delete DB.sessions[state.token];if(m)m.onlineAt='';setToken('');saveDB();state.view='dashboard';state.screen='landing';renderApp();toast('Signed out — see you soon!','info')},
  'chat-with':d=>{state.view='chat';state.chatWith=d.id;renderApp()},
  'open-chat':d=>{state.chatWith=d.id;renderApp()},
  'back-chat':()=>{state.chatWith='';renderApp()},
  'close-modal':()=>closeModal(),
  /* feed */
  'attach-post':()=>attachMedia('any'),
  'submit-post':()=>submitPost(),
  'like':d=>{const p=DB.posts.find(x=>x.id===d.id);if(!p)return;const m=me();
    if(p.likes.includes(m.id)){p.likes=p.likes.filter(x=>x!==m.id)}
    else{p.likes.push(m.id);if(p.userId!==m.id)notify(p.userId,displayName(m)+' liked your post','success')}
    saveDB();renderApp()},
  'comments':d=>{state['copen_'+d.id]=!state['copen_'+d.id];renderApp()},
  'del-post':async d=>{const p=DB.posts.find(x=>x.id===d.id);if(!p)return;
    for(const md of p.media)await delMedia(md.id);
    DB.posts=DB.posts.filter(x=>x.id!==d.id);saveDB();renderApp();toast('Post deleted','info')},
  'del-comment':d=>{const p=DB.posts.find(x=>x.id===d.id);if(!p)return;p.comments=p.comments.filter(c=>c.id!==d.cid);saveDB();renderApp()},
  /* status */
  'add-status':()=>{stMedia=null;openStatusModal()},
  'st-bg':d=>{stBg=Number(d.i);$$('.bgpick button').forEach((b,i)=>b.classList.toggle('on',i===stBg))},
  'st-attach':async()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*,video/*';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{toast('Processing media…','info');stMedia=await storeMedia(f);
      $('#st-prev').innerHTML=renderMediaPreview(stMedia);hydrateMedia()}catch(e){toast(e.message,'error')}};inp.click()},
  'submit-status':()=>submitStatus(),
  'view-story':d=>openViewer(Number(d.idx)),
  'story-nav':d=>{const n=state.storyIdx+Number(d.d);if(n<0||n>=state.storyList.length)return;openViewer(n)},
  'close-viewer':()=>closeViewer(),
  'del-story':async d=>{if(!await confirmDestructive('Delete this story?'))return;const s=DB.stories.find(x=>x.id===d.id);if(s&&s.mediaId)await delMedia(s.mediaId);DB.stories=DB.stories.filter(x=>x.id!==d.id);saveDB();renderApp();toast('Story deleted','info')},
  'del-story-view':async()=>{const s=state.storyList[state.storyIdx];if(!s)return;
    if(!await confirmDestructive('Delete this story?'))return;
    if(s.mediaId)await delMedia(s.mediaId);DB.stories=DB.stories.filter(x=>x.id!==s.id);saveDB();closeViewer();toast('Story deleted','info')},
  'send-story-reply':()=>{const inp=$('#story-reply');if(!inp)return;const t=inp.value.trim();if(!t)return;
    const s=state.storyList[state.storyIdx];if(!s)return;const m=me();
    DB.messages.push({id:uid(),pair:'story:'+s.id,from:m.id,to:s.userId,text:t,mediaId:'',mediaType:'',replyTo:s.id,deleted:false,at:nowISO()});
    notify(s.userId,displayName(m)+' replied to your story','info');saveDB();closeViewer();toast('Reply sent to '+displayName(userById(s.userId)),'success')},
  /* chat */
  'chat-attach':async()=>{if(!state.chatWith)return;const inp=document.createElement('input');inp.type='file';inp.accept='image/*,video/*';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{toast('Sending media…','info');const md=await storeMedia(f);sendChat(state.chatWith,'',md)}catch(e){toast(e.message,'error')}};inp.click()},
  'del-msg':async d=>{const x=DB.messages.find(y=>y.id===d.id);if(!x)return;
    if(!await confirmDestructive('Delete this message for both?'))return;
    if(x.mediaId)await delMedia(x.mediaId);
    x.deleted=true;x.text='';x.mediaId='';saveDB();renderApp();toast('Message deleted','info')},
  /* awards */
  'add-award':()=>openAwardModal(),
  'aw-cat':d=>{awCat=d.c;$$('.cato').forEach(el=>el.classList.toggle('on',el.dataset.c===d.c))},
  'aw-attach':async()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{toast('Attaching proof…','info');awMedia=await storeMedia(f);
      $('#aw-prev').innerHTML=renderMediaPreview(awMedia);hydrateMedia()}catch(e){toast(e.message,'error')}};inp.click()},
  'submit-award':()=>submitAward(),
  'aw-filter':d=>{state.awardFilter=d.f;renderApp()},
  'approve-award':d=>approveAward(d.id),
  'reject-award':d=>rejectAward(d.id),
  'del-award':async d=>{if(!await confirmDestructive('Remove this achievement?'))return;
    const a=DB.achievements.find(x=>x.id===d.id);if(a&&a.mediaId)await delMedia(a.mediaId);
    DB.achievements=DB.achievements.filter(x=>x.id!==d.id);saveDB();renderApp();toast('Achievement removed','info')},
  /* notices */
  'add-notice':()=>openNoticeModal(),
  'submit-notice':()=>submitNotice(),
  'del-notice':async d=>{if(!await confirmDestructive('Delete this notice?'))return;DB.announcements=DB.announcements.filter(x=>x.id!==d.id);saveDB();renderApp();toast('Notice deleted','info')},
  /* members */
  'add-admission':()=>openAdmissionModal(),
  'save-admission':()=>saveAdmission(),
  'make-vip':d=>{const u=userById(d.id);if(!u)return;u.role='vip';u.vipSince=nowISO();
    notify(u.id,'You are now a VIP moderator — enjoy the powers!','success');saveDB();renderApp();toast(displayName(u)+' is now VIP','success')},
  'un-vip':d=>{const u=userById(d.id);if(!u)return;u.role='member';u.vipSince='';
    notify(u.id,'Your VIP status was removed','info');saveDB();renderApp();toast('VIP removed from '+displayName(u),'info')},
  'disable-user':d=>{const u=userById(d.id);if(!u)return;u.disabled=true;
    for(const t in DB.sessions)if(DB.sessions[t]===u.id)delete DB.sessions[t];
    notify(u.id,'Your account was disabled by a moderator','error');saveDB();renderApp();toast(displayName(u)+' disabled','info')},
  'enable-user':d=>{const u=userById(d.id);if(!u)return;u.disabled=false;
    notify(u.id,'Your account was re-enabled','success');saveDB();renderApp();toast(displayName(u)+' enabled again','success')},
  'reset-pass':async d=>{const u=userById(d.id);if(!u)return;
    const np=await promptText('Reset password for '+displayName(u),'','New password (min 6)');
    if(np===null)return;if(np.length<6)return toast('Password must be at least 6 characters','warning');
    u.password=await hashPassword(np);
    for(const t in DB.sessions)if(DB.sessions[t]===u.id)delete DB.sessions[t];
    notify(u.id,'Your password was reset by a moderator','info');saveDB();renderApp();toast('Password reset for '+displayName(u),'success')},
  'del-user':async d=>{const u=userById(d.id);if(!u)return;
    if(!await confirmDestructive('Permanently delete '+displayName(u)+' and all their data?'))return;
    for(const p of DB.posts.filter(p=>p.userId===u.id))for(const md of p.media)await delMedia(md.id);
    DB.posts=DB.posts.filter(p=>p.userId!==u.id);
    for(const s of DB.stories.filter(s=>s.userId===u.id))if(s.mediaId)await delMedia(s.mediaId);
    DB.stories=DB.stories.filter(s=>s.userId!==u.id);
    DB.messages=DB.messages.filter(x=>x.from!==u.id&&x.to!==u.id);
    DB.achievements=DB.achievements.filter(a=>a.userId!==u.id);
    DB.skills=DB.skills.filter(s=>s.userId!==u.id);
    DB.notifications=DB.notifications.filter(n=>n.userId!==u.id);
    for(const t in DB.sessions)if(DB.sessions[t]===u.id)delete DB.sessions[t];
    DB.users=DB.users.filter(x=>x.id!==u.id);saveDB();renderApp();toast(displayName(u)+' deleted','info')},
  /* vault */
  'vault-del':async d=>{if(!await confirmDestructive('Delete this media from campus?'))return;
    const f=DB.files.find(x=>x.id===d.id);await delMedia(d.id);
    if(f){DB.posts.forEach(p=>{if(p.media)p.media=p.media.filter(m=>m.id!==d.id)});
      DB.stories.forEach(s=>{if(s.mediaId===d.id){s.type='text';s.mediaId=''}});
      DB.achievements.forEach(a=>{if(a.mediaId===d.id)a.mediaId=''});
      DB.messages.forEach(x=>{if(x.mediaId===d.id){x.mediaId='';x.deleted=true;x.text=''}});}
    saveDB();renderApp();toast('Media deleted','info')},
  /* academic */
  'ac-subject':d=>{state.acSubject=d.id;renderApp()},
  'save-marks':()=>saveMarks(),
  /* profile */
  'add-skill':async()=>{const name=await promptText('Add a skill','','e.g. Calligraphy');if(name===null||!name)return;
    const lvl=Number(await new Promise(res=>{openModal(`<div class="sh"><h3>Skill level</h3></div>
      <p class="small muted" style="margin-bottom:12px">How good are you at <b>${esc(name)}</b>?</p>
      <div class="catgrid">${[1,2,3,4,5].map(l=>`<button class="btn" data-l="${l}" style="width:auto">${l} — ${['Beginner','Basic','Good','Advanced','Expert'][l-1]}</button>`).join('')}</div>`);
      $$('#modal-root [data-l]').forEach(b=>b.onclick=()=>{const v=Number(b.dataset.l);closeModal();res(v)})}));
    DB.skills.push({id:uid(),userId:me().id,name,level:lvl});saveDB();renderApp();toast('Skill added','success')},
  'del-skill':async d=>{DB.skills=DB.skills.filter(s=>s.id!==d.id);saveDB();renderApp();toast('Skill removed','info')},
  'change-photo':()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{toast('Updating photo…','info');
      const m=me();if(m.photoId)await delMedia(m.photoId);
      const md=await storeMedia(f);m.photoId=md.id;saveDB();renderApp();toast('Profile photo updated','success')}catch(e){toast(e.message,'error')}};inp.click()},
  'save-profile':()=>{const m=me();
    m.fullName=$('#ep-name').value.trim();m.dob=$('#ep-dob').value;m.klass=$('#ep-klass').value.trim();
    m.guardian=$('#ep-guardian').value.trim();m.phone=$('#ep-phone').value.trim();m.address=$('#ep-address').value.trim();m.bio=$('#ep-bio').value.trim();
    if(!m.fullName)return toast('Full name is required','warning');
    saveDB();state.editMode=false;renderApp();toast('Profile saved','success')},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('viewer')&&e.target.closest('.stage'))return; // clicks inside the story stage never close the viewer (buttons inside still work)
  const fn=ACTIONS[el.dataset.act];
  if(fn){e.preventDefault();fn(el.dataset,el,e)}
  else if(el.dataset.act==='noop')e.preventDefault();
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const kind=f.dataset.form;
  if(kind==='login')doLogin();
  else if(kind==='comment'){const inp=f.querySelector('[data-role=c-input]'),t=inp.value.trim();if(!t)return;
    const p=DB.posts.find(x=>x.id===f.dataset.id);if(!p)return;const m=me();
    p.comments.push({id:uid(),userId:m.id,text:t,at:nowISO()});
    if(p.userId!==m.id)notify(p.userId,displayName(m)+' commented on your post','info');
    saveDB();renderApp()}
  else if(kind==='chat-send'){const inp=$('#chat-text'),t=inp.value.trim();if(!t)return;sendChat(f.dataset.id,t);inp.value=''}
  else if(kind==='change-pass'){(async()=>{
    const m=me(),c1=$('#cp-1').value,n1=$('#cp-2').value;
    if(!(await verifyPassword(c1,m.password)))return toast('Current password is incorrect','error');
    if(n1.length<6)return toast('New password must be at least 6 characters','warning');
    if(n1===c1)return toast('New password must be different','warning');
    m.password=await hashPassword(n1);saveDB();renderApp();toast('Password updated — use it next time you sign in','success');
  })()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='g-search'){state.search=e.target.value;state.searchOpen=true;
    const app=$('#app');renderApp();const inp=$('#g-search');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
  if(e.target.id==='m-search'){mSearch=e.target.value;
    const rows=$('.card.pad');renderApp();const inp=$('#m-search');if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}}
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&state.screen==='app'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();const g=$('#g-search');if(g)g.focus()}
  if(e.key==='Escape'){if($('#viewer-root').innerHTML)closeViewer();else closeModal()}
});
document.addEventListener('mousedown',e=>{
  if(state.bellOpen||state.menuOpen||state.searchOpen){
    if(!e.target.closest('.bell-wrap')&&!e.target.closest('.pop')&&!e.target.closest('.me-chip')&&!e.target.closest('.searchbox'))
      {state.bellOpen=false;state.menuOpen=false;if(state.searchOpen){state.searchOpen=false;renderApp()}}
  }
});

/* ═══════════ boot ═══════════ */
function fatalScreen(msg){
  const sp=$('#splash');if(sp)sp.remove();
  const app=$('#app');
  if(app&&!app.innerHTML.trim())app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
    <div class="card pad" style="max-width:430px;width:100%;text-align:center">
      <div style="width:54px;height:54px;border-radius:16px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:24px;font-weight:800">!</div>
      <h3 style="margin-bottom:8px">The app could not start</h3>
      <p class="small muted" style="margin-bottom:14px">${esc(msg)}</p>
      <button class="btn btn-primary btn-block" onclick="location.reload()">Reload</button>
    </div></div>`;
}
window.addEventListener('error',e=>{if($('#splash'))fatalScreen((e&&e.message)||'Unexpected error')});
window.addEventListener('unhandledrejection',e=>{if($('#splash'))fatalScreen((e&&e.reason&&e.reason.message)||'Unexpected error')});
(async function boot(){
  try{
    loadDB();await ensureSeed();await Media.init();
    const th=LS.get('fm_theme');
    if(th==='dark')document.documentElement.classList.add('dark');
    // restore session
    if(state.token&&!DB.sessions[state.token])setToken('');
    const m=me();if(m){m.onlineAt=nowISO();saveDB()}
    state.screen=m?'app':'landing';
    renderApp();
  }catch(err){fatalScreen((err&&err.message)||'Startup failed — please reload');return}
  const sp=$('#splash');
  if(sp){sp.style.transition='opacity .4s';sp.style.opacity='0';setTimeout(()=>{const s=$('#splash');if(s)s.remove()},450)}
  // presence + cleanup heartbeat
  setInterval(()=>{const u=me();if(u){u.onlineAt=nowISO();saveDB()}},30000);
  setInterval(()=>{ // story expiry + badge refresh
    const cut=Date.now()-864e5;const before=DB.stories.length;
    DB.stories=DB.stories.filter(s=>new Date(s.at).getTime()>cut);
    if(DB.stories.length!==before){for(const s of []){};saveDB()}
    if(state.screen==='app'&&me()&&state.view!=='chat'){/* keep badge fresh on next render */}
  },60000);
})();
/* watchdog — the splash must NEVER blink forever */
setTimeout(()=>{if($('#splash'))fatalScreen('Startup timed out. Your browser may be blocking storage for this file — open it in Chrome or Edge, or press Reload.')},7000);
</script>
